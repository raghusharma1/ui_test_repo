[pytest]
; Tests live in feature-named subdirectories under tests/ (e.g. tests/credit_limit/)
testpaths = tests
; Self-contained HTML report per run, written alongside failure artifacts
addopts = -v --html=reports/report.html --self-contained-html
; Live logging: step logs from tests/pages appear in the console (and in
; captured output on failure), replacing print() statements.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
